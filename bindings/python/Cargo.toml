[package]
name = "ebur128-stream-python"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Python bindings for ebur128-stream via pyo3."
publish = false

[lib]
name = "ebur128_stream_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
ebur128-stream = { path = "../..", default-features = false, features = ["std", "alloc"] }

[package.metadata.maturin]
python-source = "python"
module-name = "ebur128_stream"
