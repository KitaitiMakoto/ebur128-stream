[package]
name = "ebur128-stream"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Streaming, zero-allocation EBU R128 loudness measurement in pure Rust."
documentation = "https://docs.rs/ebur128-stream"
repository = "https://github.com/vanjamodrinjak21/ebur128-stream"
readme = "README.md"
keywords = ["audio", "dsp", "loudness", "ebur128", "bs1770"]
categories = ["multimedia::audio", "no-std"]

[features]
default = ["std", "alloc"]
std = ["alloc"]
alloc = []
f64 = []
serde = ["dep:serde", "bitflags/serde"]
tokio = ["dep:futures-sink", "std"]
cli = ["dep:hound", "std"]
svg = ["std"]
normalize = ["std"]
resampler = ["dep:rubato", "std"]
simd = ["dep:wide", "std"]

[dependencies]
bitflags = { version = "2", default-features = false }
libm = { version = "0.2", default-features = false }
serde = { version = "1", optional = true, default-features = false, features = ["derive"] }
futures-sink = { version = "0.3", optional = true, default-features = false }
hound = { version = "3", optional = true }
rubato = { version = "0.15", optional = true, default-features = false }
wide = { version = "0.7", optional = true, default-features = false }

[dev-dependencies]
hound = "3"
criterion = { version = "0.5", default-features = false, features = ["html_reports"] }
ebur128 = "0.1"
proptest = { version = "1", default-features = false, features = ["std"] }

[[bench]]
name = "throughput"
harness = false

[lib]
bench = false

[[bin]]
name = "lufs"
required-features = ["cli"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
